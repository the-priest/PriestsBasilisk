
name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-python-cairo
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-gobject-introspection
            mingw-w64-x86_64-gsettings-desktop-schemas
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python-pyinstaller

      - name: Build Executable
        shell: msys2 {0}
        run: |
          pyinstaller --onefile \
            --collect-all gi \
            --add-data "/mingw64/lib/girepository-1.0;lib/girepository-1.0" \
            --add-data "/mingw64/share/glib-2.0/schemas;share/glib-2.0/schemas" \
            --add-data "assets;assets" \
            basilisk.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: basilisk-windows-exe
          path: dist/basilisk.exe
